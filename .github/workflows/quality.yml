name: ElectroLoad Pro QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/cable-sizing-engine-v2]

jobs:
  javascript-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check application scripts
        run: |
          for file in js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
          node --check tests/cable-sizing.test.js
      - name: Run unit and regression tests
        run: node --test
