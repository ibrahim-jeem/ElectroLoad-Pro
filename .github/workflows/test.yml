name: ElectroLoad Pro tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/electrical-safety-board-hierarchy-sld

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
